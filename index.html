<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thiệp Hoa 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap">
<style>
/* Layout: một sân khấu đêm tối, thiệp 3D đặt giữa, canvas pháo hoa phủ lên trên, thanh nút + ngăn chỉnh sửa ở dưới. */
:root{
  color-scheme:dark;
  --night:#14061c;
  --night2:#2a0d33;
  --gold:#f3c978;
  --gold2:#ffe7a8;
  --paper:#fff7f0;
  --ink:#5b2340;
  --ui:#ffe9ef;
  --ui-bg:rgba(32,12,40,.94);
  --ui-line:rgba(243,201,120,.35);
  --c1:#7d1442;
  --c2:#e8557f;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-script:"Dancing Script","Segoe Script","Brush Script MT",cursive;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body[data-theme="violet"]{--c1:#34156e;--c2:#b06ad9}
body[data-theme="crimson"]{--c1:#6e0b1b;--c2:#d8452f}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 80% 55% at 50% 105%,#6a1d55 0,transparent 70%),linear-gradient(180deg,var(--night),var(--night2));
  color:var(--ui);font-family:var(--f-body);
}
#stars{position:fixed;left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent;pointer-events:none}
#stage{flex:1;min-height:0;display:grid;place-items:center;perspective:2200px;position:relative}
#scene{transform-style:preserve-3d;transition:transform .5s ease-out}
#fit{width:var(--W);height:var(--H);transform-style:preserve-3d;transform:scale(var(--s,1));transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,233,239,.6);pointer-events:none}

.book{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;cursor:pointer;transition:transform 1.4s cubic-bezier(.5,0,.2,1);outline:none}
.book:focus-visible{outline:2px solid var(--gold);outline-offset:8px}
body:not(.v) .book.open{transform:translateX(calc(var(--W) / 2))}
body.v .book.open{transform:translateY(calc(var(--H) / 2))}

.shadow{position:absolute;left:8%;right:-6%;bottom:-7%;height:9%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);transform:translateZ(-30px)}

.page{position:absolute;inset:0;transform:translateZ(-1px);background:var(--paper);border-radius:2px 8px 8px 2px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:11% 10% 9%;color:var(--ink);text-align:center;overflow:hidden}
.page::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(90,35,64,.18),transparent 14%);pointer-events:none}
body.v .page::before{background:linear-gradient(180deg,rgba(90,35,64,.18),transparent 10%)}
.page::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,150,60,.55);border-radius:3px;pointer-events:none}
.to{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:calc(var(--W) * .058);color:#a3294f;white-space:pre-wrap;overflow-wrap:anywhere}
.msgwrap{flex:1;min-height:0;margin:5% 0 3%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.msg{margin:0;width:100%;font-family:var(--f-script);font-weight:600;line-height:1.28;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.from{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:calc(var(--W) * .052);color:#a3294f;white-space:pre-wrap;overflow-wrap:anywhere}
.orn{width:34%;margin:3% auto 0;display:block;height:auto}

.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.45,.05,.2,1)}
.open .cover{transform:rotateY(-180deg)}
body.v .cover{transform-origin:center top}
body.v .open .cover{transform:rotateX(180deg)}
.face{position:absolute;inset:0;transform-style:preserve-3d;backface-visibility:hidden}
.face *{backface-visibility:hidden}
.front{border-radius:3px 10px 10px 3px;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12)}
.front::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%);background-size:260% 100%;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.front::after{content:"";position:absolute;inset:12px;border:1.5px solid rgba(243,201,120,.7);border-radius:4px;pointer-events:none}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;padding:14%;text-align:center;transform:translateZ(14px)}
.sub{font-size:calc(var(--W) * .033);letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);white-space:pre-wrap}
.title{font-family:var(--f-display);font-style:italic;font-weight:700;line-height:1.05;white-space:pre-line;overflow-wrap:anywhere;
  background:linear-gradient(180deg,#fff6cf,var(--gold) 60%,#d49a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.tap{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:calc(var(--W) * .033);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,240,230,.85);transform:translateZ(14px);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.open .tap{display:none}

.back{background:var(--paper);border-radius:10px 3px 3px 10px;transform:rotateY(180deg);box-shadow:0 20px 50px rgba(0,0,0,.45)}
body.v .back{transform:rotateX(180deg);border-radius:3px 3px 10px 10px}
.back::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(270deg,rgba(90,35,64,.18),transparent 14%);pointer-events:none}
body.v .back::before{background:linear-gradient(0deg,rgba(90,35,64,.18),transparent 10%)}
.back::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,150,60,.55);border-radius:3px;pointer-events:none}
.bq{position:absolute;inset:0;transform-style:preserve-3d}
.bq svg.stems{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fl{position:absolute;transform:translate(-50%,-50%) scale(.001);height:auto;pointer-events:none}
.open .fl{animation:bloom 1.1s var(--d,1.2s) cubic-bezier(.2,1.5,.35,1) forwards,sway 5s calc(var(--d,1.2s) + 1.2s) ease-in-out infinite alternate}
@keyframes bloom{from{transform:translate(-50%,-50%) scale(.001) rotate(-50deg)}to{transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes sway{from{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}to{transform:translate(-50%,-50%) scale(1.03) rotate(3deg)}}
.lf{position:absolute;pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:var(--f-display);font-style:italic;font-weight:600;color:#a3294f;font-size:calc(var(--W) * .05);transform:translateZ(6px)}
.cap small{display:block;font-family:var(--f-body);font-style:normal;font-weight:400;font-size:.55em;letter-spacing:.2em;text-transform:uppercase;color:#8a6a55;margin-top:.3em}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

#bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 0 max(14px,env(safe-area-inset-bottom,0px));position:relative;z-index:6}
button{font:600 14px/1 var(--f-body);color:var(--ui);background:rgba(255,255,255,.07);border:1px solid var(--ui-line);border-radius:999px;padding:12px 18px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:rgba(255,255,255,.15)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.main{background:linear-gradient(135deg,#e8557f,#c2255c);border-color:transparent}
button[aria-pressed="true"]{border-color:var(--gold);background:rgba(243,201,120,.18)}

#sheet{position:relative;z-index:6;margin:0 auto 12px;width:100%;max-width:880px;max-height:42vh;overflow:auto;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;color:#f1c9d6;min-width:0}
input,textarea{font:400 15px/1.4 var(--f-body);color:var(--ui);background:rgba(0,0,0,.28);border:1px solid rgba(255,233,239,.22);border-radius:8px;padding:9px 11px;width:100%;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips span{font-size:12px;letter-spacing:.06em;color:#f1c9d6;margin-right:2px}
.chips button{padding:8px 13px;font-size:13px}
.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:#fff}
@media (max-width:720px){.grid{grid-template-columns:1fr}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.front::before,.tap,.open .fl{animation:none}.open .fl{transform:translate(-50%,-50%)}}
</style>

<div id="stars" aria-hidden="true"></div>
<main id="stage">
  <div class="hint">Kéo chuột để xoay · Chạm vào thiệp để mở</div>
  <div id="scene">
    <div id="fit">
      <div class="book" id="book" role="button" tabindex="0" aria-expanded="false" aria-label="Thiệp chúc mừng 20/10. Nhấn để mở thiệp">

        <div class="page">
          <div class="to" id="o-to"></div>
          <div class="msgwrap"><p class="msg" id="o-msg"></p></div>
          <div class="from" id="o-from"></div>
          <svg class="orn" viewBox="0 0 120 20" aria-hidden="true"><path d="M2 10h44M74 10h44" stroke="#c9963c" stroke-width="1.2" fill="none"/><path d="M60 3c3 3 3 11 0 14-3-3-3-11 0-14zM52 10c4-3 8 0 8 0s-4 3-8 0zM68 10c-4-3-8 0-8 0s4 3 8 0z" fill="#d9486f"/></svg>
        </div>
        <div class="cover" id="cover">
          <div class="face front" id="front">

          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="bar">
  <button id="b-open" class="main" type="button">Mở thiệp</button>
  <button id="b-fire" type="button">Bắn pháo hoa</button>
  <button id="b-edit" type="button" aria-pressed="false" aria-controls="sheet">Chỉnh lời chúc</button>
</div>

<section id="sheet" hidden aria-label="Chỉnh nội dung thiệp">
  <div class="chips" id="presets"><span>Lời chúc cho</span></div>
  <div class="grid">
    <div class="col">
      <label for="i-sub">Dòng nhỏ trên bìa<input id="i-sub" type="text" maxlength="40"></label>
      <label for="i-title">Tiêu đề bìa<textarea id="i-title" rows="2" maxlength="40"></textarea></label>
      <label for="i-to">Gửi tới<input id="i-to" type="text" maxlength="40"></label>
      <label for="i-from">Người gửi<input id="i-from" type="text" maxlength="40"></label>
    </div>
    <div class="col">
      <label for="i-msg">Lời chúc<textarea id="i-msg" rows="8" maxlength="420"></textarea></label>
      <div class="chips" style="margin:0"><span>Màu bìa</span>
        <button class="sw" type="button" data-theme="rose" style="background:linear-gradient(135deg,#7d1442,#e8557f)" aria-label="Hồng đào"></button>
        <button class="sw" type="button" data-theme="violet" style="background:linear-gradient(135deg,#34156e,#b06ad9)" aria-label="Tím mơ"></button>
        <button class="sw" type="button" data-theme="crimson" style="background:linear-gradient(135deg,#6e0b1b,#d8452f)" aria-label="Đỏ thắm"></button>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Nội dung ---------- */
var DEF={title:"Chúc mừng\n20/10",sub:"Ngày Phụ nữ Việt Nam",to:"Mẹ yêu",from:"Tan",theme:"rose",
 msg:"Mẹ là nguồn sáng giữa đời con,\nChăm lo từng chút, chẳng hao mòn.\nNgày của mẹ, con xin dâng kính,\nLời chúc an vui, vạn phúc tròn."};
var PRESETS=[
 {n:"Bác gái",to:"Bác",from:"Tan",msg:"Con chúc bác luôn khỏe mạnh, trẻ đẹp và vui vẻ bên gia đình. Chúc bác một ngày 20/10 thật ngập tràn hoa và nụ cười."},
 {n:"Mẹ",to:"Mẹ yêu",from:"Tan",msg:"Mẹ là nguồn sáng giữa đời con,\nChăm lo từng chút, chẳng hao mòn.\nNgày của mẹ, con xin dâng kính,\nLời chúc an vui, vạn phúc tròn."},
 {n:"Cô",to:"Cô",from:"Tan",msg:"Nhân ngày 20/10, con chúc cô luôn xinh đẹp, luôn mạnh khỏe, luôn hạnh phúc và gặp nhiều điều tốt đẹp trong cuộc sống và công việc."},
 {n:"Em gái",to:"Em gái",from:"Tan",msg:"Chúc em gái của anh luôn xinh đẹp, vui vẻ và thật tự tin theo đuổi mọi ước mơ. Chúc em một ngày 20/10 thật rực rỡ."}
];
var KEY="thiep-2010-v2", S=Object.assign({},DEF);
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function fit(el,max,min){
  var s=max;el.style.fontSize=s+"px";
  while(s>min&&(el.scrollHeight>el.parentElement.clientHeight+1||el.scrollWidth>el.clientWidth+1)){s-=1;el.style.fontSize=s+"px"}
}
function render(){
  $("o-to").textContent="Gửi "+S.to+",";
  $("o-from").textContent="— "+S.from;
  $("o-msg").textContent=S.msg;
  $("o-sub").textContent=S.sub;
  $("o-title").textContent=S.title;
  document.body.setAttribute("data-theme",S.theme);
  var W=$("book").clientWidth||300;
  var m=$("o-msg");m.parentElement.style.height="";
  fit(m,Math.round(W*.115),12);
  var t=$("o-title");
  t.style.fontSize=Math.round(W*.2)+"px";
  var lim=W*.72,sz=W*.2;
  while(sz>14&&(t.scrollWidth>lim||t.offsetHeight>W*.55)){sz-=2;t.style.fontSize=sz+"px"}
}

/* ---------- Hoa SVG ---------- */
var uid=0;
var PAL={pink:["#ffd3de","#ff7aa2","#b8174f"],coral:["#ffe3cf","#ff9a76","#cf4a3e"],white:["#ffffff","#ffe6ee","#f0a9bf"],gold:["#fff2b0","#ffcb4a","#dc9a1c"],lilac:["#f6e4ff","#c690f3","#7a3cb0"]};
function flowerSVG(p){
  var id="g"+(uid++),s='<defs><linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-46"><stop offset="0" stop-color="'+p[2]+'"/><stop offset=".55" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[0]+'"/></linearGradient></defs>';
  var rings=[[9,1,0],[7,.72,20],[5,.46,10]];
  rings.forEach(function(r){for(var i=0;i<r[0];i++){var a=r[2]+i*360/r[0];
    s+='<path transform="rotate('+a+') scale('+r[1]+')" d="M0 0C-17-8-19-34 0-46C19-34 17-8 0 0Z" fill="url(#'+id+')" stroke="rgba(120,20,60,.28)" stroke-width="1"/>'}});
  s+='<circle r="5" fill="#f6b73c"/><circle r="2" cx="-1.5" cy="-1" fill="#fff3b0"/>';
  return s;
}
function flowerEl(p,cls){
  var e=document.createElementNS("http://www.w3.org/2000/svg","svg");
  e.setAttribute("viewBox","-50 -50 100 100");e.setAttribute("class",cls||"");e.innerHTML=flowerSVG(p);return e;
}
function leafEl(w,rot,z){
  var e=document.createElementNS("http://www.w3.org/2000/svg","svg");
  e.setAttribute("viewBox","0 0 40 80");e.setAttribute("class","lf");
  e.innerHTML='<defs><linearGradient id="lg'+(uid)+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fa86a"/><stop offset="1" stop-color="#1f6b44"/></linearGradient></defs><path d="M20 78C2 56 2 22 20 2c18 20 18 54 0 76z" fill="url(#lg'+(uid++)+')"/><path d="M20 76V10" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>';
  e.style.width=w+"%";e.style.transform="rotate("+rot+"deg) translateZ("+z+"px)";return e;
}
function place(parent,p,x,y,size,z,delay){
  var f=flowerEl(PAL[p],"fl");f.style.left=x+"%";f.style.top=y+"%";f.style.width=size+"%";
  f.style.transform="translate(-50%,-50%) translateZ("+z+"px)";
  if(delay!=null)f.style.setProperty("--d",delay+"s");
  parent.appendChild(f);return f;
}
function buildDeco(){
  var front=$("front"),bq=$("bq");
  var C=[["pink",21,17,38],["coral",40,8,22],["white",9,38,24],["gold",31,30,14],
         ["pink",79,83,38],["lilac",60,92,22],["white",91,62,24],["gold",69,70,14]];
  var lv=[[10,38,-30],[70,60,160],[14,6,20],[58,68,-160]];
  lv.forEach(function(l){var e=leafEl(15,l[2],6);e.style.left=l[0]+"%";e.style.top=l[1]+"%";front.appendChild(e)});
  C.forEach(function(c,i){var f=flowerEl(PAL[c[0]],"fl");f.style.left=c[1]+"%";f.style.top=c[2]+"%";f.style.width=c[3]+"%";
    f.style.transform="translate(-50%,-50%) scale(1) translateZ("+(16+i%3*6)+"px)";f.style.animation="none";f.style.setProperty("--d","0s");
    f.style.transformOrigin="center";front.appendChild(f)});
  /* bó hoa mặt trong */
  var ns="http://www.w3.org/2000/svg",st=document.createElementNS(ns,"svg");
  st.setAttribute("class","stems");st.setAttribute("viewBox","0 0 100 140");st.setAttribute("preserveAspectRatio","none");
  var B=[["pink",50,38,40],["coral",28,52,30],["white",72,52,31],["gold",36,24,24],["lilac",64,26,25],["pink",50,66,24],["white",18,34,20],["coral",82,36,20]];
  var h='';
  B.forEach(function(b){h+='<path d="M50 112Q'+((50+b[1])/2)+' '+(100-(112-b[2]*1.4)/6)+' '+b[1]+' '+(b[2]*1.4)+'" stroke="#2f7d4f" stroke-width="1.6" fill="none" stroke-linecap="round"/>'});
  h+='<path d="M38 108Q50 100 62 108L56 124H44z" fill="#f3c978" opacity=".9"/><path d="M44 112Q50 118 56 112" stroke="#d9486f" stroke-width="2.4" fill="none"/>';
  st.innerHTML=h;bq.appendChild(st);
  [[26,70,-35],[72,72,35],[18,52,-60],[80,54,60]].forEach(function(l){var e=leafEl(13,l[2],4);e.style.left=l[0]+"%";e.style.top=l[1]+"%";bq.appendChild(e)});
  B.forEach(function(b,i){place(bq,b[0],b[1],b[2]*1.4/1.4,b[3],10+i*3,1.0+i*.14)});
}
buildDeco();

/* ---------- Sao nền ---------- */
(function(){var s=[],i;for(i=0;i<90;i++){s.push(Math.round(rnd(0,100)*10)/10+"vw "+Math.round(rnd(0,100)*10)/10+"vh 0 "+(Math.random()<.2?1:0)+"px rgba(255,236,245,"+rnd(.25,.8).toFixed(2)+")")}
 $("stars").style.boxShadow=s.join(",")})();

/* ---------- Bố cục & 3D ---------- */
var stage=$("stage"),fitEl=$("fit"),scene=$("scene"),book=$("book");
var isOpen=false,sClosed=1,sOpen=1,px=0,py=0,vert=false;
function layout(){
  var sw=stage.clientWidth,sh=stage.clientHeight;
  vert=sw<720||sh>sw*1.15;
  document.body.classList.toggle("v",vert);
  var W,H;
  if(vert){W=Math.max(180,Math.min(340,sw-40));H=W*1.4;
    sClosed=Math.min(1,(sh-16)/H);sOpen=Math.min(1,(sh-16)/(2*H),(sw-8)/W)}
  else{W=Math.max(200,Math.min(380,(sh-50)/1.4,(sw-60)/2));H=W*1.4;sClosed=1;sOpen=Math.min(1,(sw-20)/(2*W))}
  var r=document.documentElement.style;
  r.setProperty("--W",W+"px");r.setProperty("--H",H+"px");
  fitEl.style.setProperty("--s",isOpen?sOpen:sClosed);
  tilt();
}
function tilt(){
  var bx=vert?-6:-14,by=isOpen?(vert?4:12):(vert?8:5);
  scene.style.transform="rotateX("+(by+py*-8)+"deg) rotateY("+(bx*(isOpen?.3:1)+px*14)+"deg)";
}
window.addEventListener("pointermove",function(e){
  px=(e.clientX/innerWidth-.5);py=(e.clientY/innerHeight-.5);if(!reduce)tilt();
});
if("ResizeObserver" in window){new ResizeObserver(function(){layout();render()}).observe(stage)}
window.addEventListener("resize",function(){layout();render()});

/* ---------- Mở / đóng ---------- */
var timers=[];
function setOpen(v){
  if(v===isOpen)return;isOpen=v;
  book.classList.toggle("open",v);book.setAttribute("aria-expanded",v);
  book.setAttribute("aria-label",v?"Thiệp đang mở. Nhấn để đóng thiệp":"Thiệp chúc mừng 20/10. Nhấn để mở thiệp");
  $("b-open").textContent=v?"Đóng thiệp":"Mở thiệp";
  fitEl.style.setProperty("--s",v?sOpen:sClosed);tilt();
  timers.forEach(clearTimeout);timers=[];
  if(v)fxOpen();else fxClose();
}
function toggle(){setOpen(!isOpen)}
book.addEventListener("click",toggle);
book.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
$("b-open").addEventListener("click",toggle);
$("b-fire").addEventListener("click",function(){if(!isOpen){setOpen(true)}else{salvo(4)}});

/* ---------- Chỉnh sửa ---------- */
var sheet=$("sheet"),bEdit=$("b-edit");
bEdit.addEventListener("click",function(){
  var show=sheet.hidden;sheet.hidden=!show;bEdit.setAttribute("aria-pressed",show);
  if(show){$("i-msg").focus({preventScroll:true})}
  setTimeout(function(){layout();render()},30);
});
var map={"i-sub":"sub","i-title":"title","i-to":"to","i-from":"from","i-msg":"msg"};
function fillInputs(){Object.keys(map).forEach(function(id){$(id).value=S[map[id]]});
  document.querySelectorAll(".sw").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme")===S.theme)})}
Object.keys(map).forEach(function(id){$(id).addEventListener("input",function(){S[map[id]]=this.value;save();render()})});
document.querySelectorAll(".sw").forEach(function(b){b.addEventListener("click",function(){S.theme=b.getAttribute("data-theme");save();fillInputs();render()})});
PRESETS.forEach(function(p){var b=document.createElement("button");b.type="button";b.textContent=p.n;
  b.addEventListener("click",function(){S.to=p.to;S.from=p.from;S.msg=p.msg;save();fillInputs();render()});$("presets").appendChild(b)});

/* ---------- Hiệu ứng canvas ---------- */
var cv=$("fx"),ctx=cv.getContext("2d"),W=0,H=0;
function sizeCv(){var d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
sizeCv();window.addEventListener("resize",sizeCv);
var rockets=[],sparks=[],petals=[],flies=[],running=false,last=0,openFx=false,nextShot=0,petalAcc=0;
var FLYMAX=reduce?3:7,PETMAX=reduce?14:46;
var PETC=["#ffb3c6","#ff7aa2","#ffd6e0","#ff9ab8","#ffe3ec","#f06292"];
var FLYH=[335,18,45,280,200,350];

function launch(type){
  var tx=rnd(W*.15,W*.85),ty=rnd(H*.12,H*.42);
  rockets.push({sx:tx+rnd(-60,60),sy:H+10,tx:tx,ty:ty,t:0,dur:rnd(.8,1.2),type:type,hue:[340,350,20,45,300,280,0,200][Math.floor(Math.random()*8)],px:0,py:H});
  start();
}
function burst(x,y,type,hue){
  var pts=[],i,n;
  if(type==="rose"){n=130;for(i=0;i<n;i++){var th=i/n*Math.PI,r=Math.cos(5*th);pts.push([r*Math.cos(th),r*Math.sin(th)])}
    for(i=0;i<16;i++){var a=i/16*Math.PI*2;pts.push([.16*Math.cos(a),.16*Math.sin(a)])}}
  else if(type==="heart"){n=90;for(i=0;i<n;i++){var t=i/n*Math.PI*2;pts.push([16*Math.pow(Math.sin(t),3)/16,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16])}}
  else{n=80;for(i=0;i<n;i++){var b=i/n*Math.PI*2;pts.push([Math.cos(b),Math.sin(b)])}}
  var k=Math.max(.7,Math.min(1.25,Math.min(W,H*1.3)/800)),S0=(type==="heart"?4.6:5)*k;
  pts.forEach(function(p){sparks.push({x:x,y:y,vx:p[0]*S0,vy:p[1]*S0,life:1,dec:rnd(.0075,.011),hue:hue+rnd(-12,12),g:Math.random()<.14,sz:rnd(5,8),rot:rnd(0,6.3)})});
  for(i=0;i<34;i++){var aa=rnd(0,6.28),sp=rnd(.4,1)*S0*.9;sparks.push({x:x,y:y,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,life:1,dec:rnd(.012,.02),hue:45,g:false,sz:1.6,rot:0})}
  if(sparks.length>2200)sparks.splice(0,sparks.length-2200);
}
function salvo(n){var types=["rose","ring","heart"];for(var i=0;i<n;i++){(function(i){timers.push(setTimeout(function(){launch(types[i%3==0?0:Math.floor(Math.random()*3)])},i*260))})(i)}}
function spawnPetal(top){
  petals.push({x:rnd(-20,W+20),y:top?rnd(-60,-10):rnd(-40,H*.3),vy:rnd(.7,1.7),sw:rnd(.6,1.6),ph:rnd(0,6.3),rot:rnd(0,6.3),vr:rnd(-.04,.04),size:rnd(7,13),c:PETC[Math.floor(Math.random()*PETC.length)],fl:rnd(0,6.3)});
}
function spawnFly(x,y){
  var side=Math.random()<.5;
  flies.push({x:x!=null?x:(side?-30:W+30),y:y!=null?y:rnd(H*.2,H*.8),vx:0,vy:0,ph:rnd(0,6),sp:rnd(1.2,2),size:rnd(13,22),hue:FLYH[Math.floor(Math.random()*FLYH.length)],tx:rnd(W*.1,W*.9),ty:rnd(H*.1,H*.75),tt:0,leave:false});
  start();
}
function fxOpen(){
  openFx=true;nextShot=performance.now()+4500;
  for(var i=0;i<(reduce?10:34);i++)spawnPetal(true);
  var plan=[[700,3],[1500,2],[2300,3],[3200,2]];
  plan.forEach(function(p){timers.push(setTimeout(function(){salvo(p[1])},p[0]))});
  for(var j=0;j<(reduce?2:5);j++){(function(j){timers.push(setTimeout(function(){spawnFly(W*.5+rnd(-80,80),H*.55)},900+j*500))})(j)}
  start();
}
function fxClose(){openFx=false;flies.forEach(function(f){f.leave=true;f.tx=f.x<W/2?-120:W+120;f.ty=f.y-100})}
function start(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}}

function drawGlyph(x,y,s,rot,col,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.globalAlpha=a;
  for(var i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-s*.55,s*.38,s*.6,0,0,6.3);ctx.fill()}
  ctx.restore();
}
function drawPetal(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(Math.cos(p.fl)*.8+.2,1);
  var s=p.size;ctx.fillStyle=p.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.moveTo(0,-s);
  ctx.bezierCurveTo(s*.9,-s*.6,s*.7,s*.7,0,s);ctx.bezierCurveTo(-s*.7,s*.7,-s*.9,-s*.6,0,-s);ctx.fill();ctx.restore();
}
function drawFly(b){
  var s=b.size,flap=Math.abs(Math.sin(b.ph))*.85+.15,hd=Math.atan2(b.vy,b.vx)+Math.PI/2;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(hd);ctx.globalAlpha=.95;
  var g=ctx.createLinearGradient(0,0,s,0);g.addColorStop(0,"hsl("+b.hue+",90%,72%)");g.addColorStop(1,"hsl("+(b.hue+35)+",90%,52%)");
  for(var d=-1;d<=1;d+=2){
    ctx.save();ctx.scale(d*flap,1);ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,-2);ctx.bezierCurveTo(s*.2,-s*1.2,s*1.15,-s*1.15,s,-s*.2);ctx.bezierCurveTo(s*.85,s*.15,s*.3,s*.2,0,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(s*.9,s*.1,s*.95,s*.9,s*.35,s*.95);ctx.bezierCurveTo(s*.1,s*.8,0,s*.4,0,0);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(s*.62,-s*.45,s*.11,0,6.3);ctx.fill();ctx.beginPath();ctx.arc(s*.45,s*.5,s*.08,0,6.3);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle="#3b1a2e";ctx.beginPath();ctx.ellipse(0,0,s*.07,s*.5,0,0,6.3);ctx.fill();
  ctx.strokeStyle="#3b1a2e";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-s*.45);ctx.quadraticCurveTo(-s*.2,-s*.8,-s*.35,-s*.85);ctx.moveTo(0,-s*.45);ctx.quadraticCurveTo(s*.2,-s*.8,s*.35,-s*.85);ctx.stroke();
  ctx.restore();
}
function ease(t){return 1-Math.pow(1-t,2.2)}

function frame(ts){
  var dt=Math.min(50,ts-last)||16.7,f=dt/16.67,i;last=ts;
  ctx.clearRect(0,0,W,H);
  if(openFx&&ts>nextShot){salvo(Math.random()<.4?2:1);nextShot=ts+rnd(1500,2800)}
  if(openFx){petalAcc+=f*(reduce?.02:.08);while(petalAcc>=1){petalAcc--;if(petals.length<PETMAX)spawnPetal(true)}
    if(flies.length<FLYMAX&&Math.random()<.008*f)spawnFly()}
  /* petals */
  for(i=petals.length-1;i>=0;i--){var p=petals[i];p.ph+=.03*f;p.fl+=.07*f;p.x+=Math.sin(p.ph)*p.sw*f;p.y+=p.vy*f;p.rot+=p.vr*f;
    if(p.y>H+30){petals.splice(i,1);continue}drawPetal(p)}
  /* rockets */
  ctx.globalCompositeOperation="lighter";
  for(i=rockets.length-1;i>=0;i--){var r=rockets[i];r.t+=dt/1000/r.dur;var e=ease(Math.min(1,r.t));
    var x=r.sx+(r.tx-r.sx)*e,y=r.sy+(r.ty-r.sy)*e;
    ctx.strokeStyle="hsla("+r.hue+",100%,80%,.8)";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(r.px||x,r.py||y);ctx.lineTo(x,y);ctx.stroke();
    r.px=x;r.py=y;
    if(r.t>=1){burst(x,y,r.type,r.hue);rockets.splice(i,1)}}
  /* sparks */
  for(i=sparks.length-1;i>=0;i--){var s=sparks[i];
    s.vx*=Math.pow(.965,f);s.vy=s.vy*Math.pow(.965,f)+.05*f;s.x+=s.vx*f;s.y+=s.vy*f;s.life-=s.dec*f;s.rot+=.05*f;
    if(s.life<=0){sparks.splice(i,1);continue}
    var a=Math.min(1,s.life*1.4);
    if(s.g){drawGlyph(s.x,s.y,s.sz*(.5+s.life*.6),s.rot,"hsl("+s.hue+",100%,72%)",a)}
    else{ctx.strokeStyle="hsla("+s.hue+",100%,"+(60+s.life*20)+"%,"+a+")";ctx.lineWidth=s.sz>1.6?2.4:1.4;ctx.beginPath();ctx.moveTo(s.x-s.vx*1.6,s.y-s.vy*1.6);ctx.lineTo(s.x,s.y);ctx.stroke()}}
  ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
  /* butterflies */
  for(i=flies.length-1;i>=0;i--){var b=flies[i];b.ph+=.34*f;b.tt-=dt/1000;
    if(!b.leave&&b.tt<=0){b.tx=rnd(W*.08,W*.92);b.ty=rnd(H*.08,H*.8);b.tt=rnd(1.5,3.2)}
    var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy)||1,sp=b.sp*1.5;
    b.vx+=(dx/d*sp-b.vx)*.03*f;b.vy+=(dy/d*sp-b.vy)*.03*f;
    b.x+=b.vx*f;b.y+=(b.vy+Math.sin(b.ph*.45)*.7)*f;
    if(b.leave&&(b.x<-100||b.x>W+100||b.y<-100)){flies.splice(i,1);continue}
    drawFly(b)}
  ctx.globalAlpha=1;
  if(!openFx&&!rockets.length&&!sparks.length&&!petals.length&&!flies.length){running=false;ctx.clearRect(0,0,W,H);return}
  requestAnimationFrame(frame);
}

/* ---------- Khởi động ---------- */
fillInputs();layout();render();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){render()})}
})();
</script>
